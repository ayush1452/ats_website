name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Scan client bundle for server credentials
        shell: bash
        run: |
          if grep -RIE 'sk-proj-|sk_live_|rk_live_|whsec_|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|STRIPE_SECRET_KEY' .next/static; then
            echo "A server credential marker was found in the client bundle."
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start local Supabase
        run: supabase start
      - name: Reset migrations and seed
        run: supabase db reset
      - name: Run pgTAP RLS and quota tests
        run: supabase test db tests/db/rls.sql
      - name: Run pgTAP schema contract tests
        run: supabase test db tests/db/schema_contract.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
